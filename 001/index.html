<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fold · Codevember 001</title>
    <meta
      name="description"
      content="A lump of soft dough you stretch and fold over itself. Codevember day 1."
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#e6dfd3" />
    <style>
      :root {
        --accent: #a86a32;
      }
      .cv-figure canvas {
        touch-action: none;
        opacity: 0;
        transition: opacity 0.6s cubic-bezier(0.2, 0.7, 0.1, 1);
      }
      .cv-figure canvas[data-cv-shown] {
        opacity: 1;
      }
      .fig {
        position: fixed;
        top: 64px;
        right: var(--gutter);
        color: var(--muted);
        text-align: right;
      }
      .still,
      .live-only {
        visibility: hidden;
      }
      [data-cv-live] .live-only {
        visibility: visible;
      }
      [data-cv-still] .cv-figure canvas,
      [data-cv-still] [data-cv-hint] {
        display: none;
      }
      [data-cv-still] .still {
        visibility: visible;
        position: absolute;
        inset: 0;
        background: url("/stills/001-wide.webp") center / cover no-repeat;
      }
      @media (max-aspect-ratio: 4 / 5) {
        [data-cv-still] .still {
          background-image: url("/stills/001-tall.webp");
        }
      }
      @media (max-width: 640px) {
        .fig {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-top mono">
      <a href="../">Codevember ’26</a>
      <span>Day 01 of 30</span>
      <nav data-cv-nav aria-label="Days"></nav>
    </header>

    <main data-cv>
      <div class="cv-figure">
        <canvas
          data-cv-canvas
          aria-label="A lump of dough on a bench. Drag an edge up and over to fold it."
        ></canvas>
        <div class="still" role="img" aria-label="A lump of dough"></div>
      </div>

      <p class="fig mono">Fig. 1<br />Dough, 400 g</p>

      <section class="cv-title">
        <span class="mono">No. 01</span>
        <h1>Fold<em>.</em></h1>
        <p>
          <em>Stretch, fold, repeat.</em> Grab the dough by an edge, pull it up and lay it over
          itself. Four folds, then let it rest.
        </p>
      </section>

      <aside class="cv-hud mono" aria-live="polite">
        <dl class="live-only">
          <dt>Folds</dt>
          <dd data-cv-folds>0 / 4</dd>
        </dl>
        <span data-cv-hint>Lift an edge, fold it over</span>
        <button type="button" class="cv-btn live-only" data-cv-reset>New dough</button>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
