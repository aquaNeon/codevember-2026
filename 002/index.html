<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shatter · Codevember 002</title>
    <meta
      name="description"
      content="A Prince Rupert's drop: a glass tear the hammer cannot break, until you snap its tail. Scroll through the fifty microseconds it takes to turn to powder. Codevember day 2."
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#8d867f" />
    <style>
      /* STUDIO */
      /* page matches the studio sweep; doubled :root beats the shared sheet */
      :root:root {
        --bone: #8d867f;
        --bone-hi: #8d867f;
        --ink: #1f1b17;
        --muted: #211c17;
        --rule: rgb(31 27 23 / 0.18);
        --accent: #3d7e8e;
      }
      html,
      body {
        background: #8d867f;
      }
      /* POLARISER */
      /* crossed polarisers black out the studio; the type turns light to stay legible */
      :root:root:has([data-cv-polarised]) {
        --bone: #151311;
        --bone-hi: #151311;
        --ink: #ece6dc;
        --muted: #b8aea1;
        --rule: rgb(236 230 220 / 0.16);
      }
      html:has([data-cv-polarised]),
      html:has([data-cv-polarised]) body {
        background: #151311;
      }
      .cv-btn[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bone);
      }
      [data-cv-canvas] {
        touch-action: none;
        user-select: none;
        -webkit-touch-callout: none;
        opacity: 0;
        transition: opacity 1.2s cubic-bezier(0.2, 0.7, 0.1, 1);
      }
      [data-cv-canvas][data-cv-shown] {
        opacity: 1;
      }
      [data-cv-canvas]:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: -8px;
      }
      .fig {
        position: fixed;
        top: 64px;
        right: var(--gutter);
        margin: 0;
        color: var(--muted);
        text-align: right;
      }
      /* TIME */
      /* no uppercase: µ would become M */
      [data-cv-time] {
        text-transform: none;
      }
      /* TIMELINE */
      .scrub {
        -webkit-appearance: none;
        appearance: none;
        width: min(200px, 44vw);
        height: 28px;
        margin: 0;
        background: transparent;
        cursor: pointer;
        touch-action: none;
      }
      .scrub::-webkit-slider-runnable-track {
        height: 1px;
        background: var(--ink);
      }
      .scrub::-moz-range-track {
        height: 1px;
        background: var(--ink);
      }
      .scrub::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        margin-top: -6px;
        border-radius: 50%;
        background: var(--ink);
        border: 3px solid var(--bone);
        box-shadow: 0 0 0 1px var(--ink);
      }
      .scrub::-moz-range-thumb {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ink);
        border: 3px solid var(--bone);
        box-shadow: 0 0 0 1px var(--ink);
      }
      .scrub:focus {
        outline: none;
      }
      .scrub:focus-visible::-webkit-slider-thumb {
        box-shadow:
          0 0 0 1px var(--ink),
          0 0 0 5px var(--bone),
          0 0 0 6px var(--ink);
      }
      .scrub:focus-visible::-moz-range-thumb {
        box-shadow:
          0 0 0 1px var(--ink),
          0 0 0 5px var(--bone),
          0 0 0 6px var(--ink);
      }
      .live-only {
        visibility: hidden;
      }
      [data-cv-live] .live-only {
        visibility: visible;
      }
      [data-cv-still] [data-cv-canvas] {
        display: none;
      }
      /* STILL */
      /* fallback capture when WebGL2 is unavailable */
      .still {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
      }
      [data-cv-still] .still {
        visibility: visible;
      }
      .still img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      @media (max-width: 640px) {
        .fig {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-top mono">
      <a href="../">Codevember ’26</a>
      <span>Day 02 of 30</span>
      <nav data-cv-nav aria-label="Days"></nav>
    </header>

    <main data-cv>
      <div class="cv-figure">
        <canvas
          data-cv-canvas
          tabindex="0"
          aria-label="A Prince Rupert's drop, a glass tear with a long thin tail, lying on a dark studio floor under a softbox. Tap the tail to snap it; tapping the bulb does nothing, it is too strong. Scroll or drag to move through the break in slow motion. Enter snaps it or reforms it, arrow keys step time."
        ></canvas>
        <div
          class="still"
          role="img"
          aria-label="A Prince Rupert's drop, a glass tear with a long thin tail, on a dark studio floor"
        ></div>
      </div>

      <p class="fig mono">Fig. 2<br />Prince Rupert's drop, 1 cm</p>

      <section class="cv-title">
        <span class="mono">No. 02</span>
        <h1>Shatter<em>.</em></h1>
        <p>
          <em>Strong at the head, fatal at the tail.</em> Snap the tail. Scroll through the fifty
          microseconds it takes.
        </p>
      </section>

      <aside class="cv-hud mono live-only">
        <dl>
          <dt>Time</dt>
          <dd data-cv-time>0.0 µs</dd>
          <dt>Front</dt>
          <dd>1.5 km/s</dd>
          <dt>Pieces</dt>
          <dd data-cv-count>1</dd>
        </dl>
        <input
          type="range"
          class="scrub"
          data-cv-scrub
          min="0"
          max="6.63"
          step="0.01"
          value="0"
          aria-label="Time"
        />
        <button type="button" class="cv-btn" data-cv-pol aria-pressed="false">Polariser</button>
        <span data-cv-hint aria-live="polite">Snap the tail</span>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
