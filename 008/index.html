<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tesseract · Codevember 008</title>
    <meta
      name="description"
      content="A hypercube drawn like a geometry plate. Drag to turn it through the fourth dimension. Codevember day 8."
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ebe5da" />
    <style>
      :root {
        --accent: #3c4f7a;
      }
      .cv-figure canvas {
        touch-action: none;
        cursor: grab;
      }
      .cv-figure canvas:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: -8px;
      }
      .fig {
        position: fixed;
        top: 64px;
        right: var(--gutter);
        color: var(--muted);
        text-align: right;
      }
      .live-only,
      .still {
        visibility: hidden;
      }
      [data-cv-live] .live-only {
        visibility: visible;
      }
      [data-cv-still] .cv-figure canvas {
        display: none;
      }
      [data-cv-still] .still {
        visibility: visible;
        position: absolute;
        left: 50%;
        top: 46%;
        width: min(70vw, 420px);
        translate: -50% -50%;
        color: var(--ink);
      }
      .views {
        display: flex;
        gap: 8px;
      }
      .views .cv-btn[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bone-hi);
      }
      @media (max-width: 640px) {
        .fig {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-top mono">
      <a href="../">Codevember ’26</a>
      <span>Day 008 of 030</span>
      <nav data-cv-nav aria-label="Days"></nav>
    </header>

    <main data-cv>
      <div class="cv-figure">
        <canvas
          data-cv-canvas
          tabindex="0"
          aria-label="A four-dimensional cube drawn in ink lines, a small cube inside a large one with their corners joined. Drag to turn it through the fourth dimension, or use the arrow keys."
        ></canvas>
        <svg class="still" viewBox="-110 -110 220 220" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="-90" y="-90" width="180" height="180" />
            <rect x="-42" y="-42" width="84" height="84" />
            <path d="M-90-90L-42-42M90-90L42-42M90 90L42 42M-90 90L-42 42" />
          </g>
        </svg>
      </div>

      <p class="fig mono">Fig. 8<br /><span data-cv-caption>Octachoron, in projection</span></p>

      <section class="cv-title">
        <span class="mono">No. 008</span>
        <h1>Tesseract<em>.</em></h1>
        <p>
          <em>A cube, one dimension up.</em> Drag to turn it through the fourth axis and watch the
          inside come out.
        </p>
      </section>

      <aside class="cv-hud mono live-only">
        <dl>
          <dt data-cv-k1>XW</dt>
          <dd data-cv-xw>0°</dd>
          <dt data-cv-k2>YW</dt>
          <dd data-cv-yw>0°</dd>
        </dl>
        <span data-cv-hint>Drag to rotate</span>
        <div class="views" role="group" aria-label="View">
          <button type="button" class="cv-btn" data-cv-view="plate" aria-pressed="false">
            Plate
          </button>
          <button type="button" class="cv-btn" data-cv-view="unfold" aria-pressed="true">
            Unfold
          </button>
        </div>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
