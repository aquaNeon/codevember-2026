<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirage · Codevember 015</title>
    <meta
      name="description"
      content="A poster of a hot horizon that moves: layers of warm air fold the sky, the sun and the posts back under the horizon, mirrored and stacked. Your cursor is the heat. Codevember day 15."
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f0e7d4" />
    <style>
      /* POSTER */
      /* this day only: the page is the sky over the ochre ground, split where the canvas puts
         its horizon, so the haze fades in over its own colours. doubled selectors win over the
         shared sheet */
      :root:root {
        --accent: #e04a22;
        --ink: #2a1c16;
        --muted: #4a3326;
        --rule: rgb(42 28 22 / 0.18);
      }
      html body {
        background: linear-gradient(
            180deg,
            #f0e7d4 0%,
            #f0e7d4 58%,
            #dfa55c 58%,
            #dfa55c 61.5%,
            #c47a35 61.5%
          )
          fixed;
      }
      .cv-figure canvas {
        touch-action: none;
        cursor: default;
        opacity: 0;
        transition: opacity 1.2s cubic-bezier(0.2, 0.7, 0.1, 1);
      }
      .cv-figure canvas[data-cv-shown] {
        opacity: 1;
      }
      .cv-figure canvas:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: -8px;
      }
      .cv-title.cv-title h1 {
        margin-bottom: 0.2em;
      }
      .fig {
        position: fixed;
        top: 64px;
        right: var(--gutter);
        margin: 0;
        color: var(--muted);
        text-align: right;
      }
      .fig em {
        font: italic 400 15px/1.4 var(--serif);
        letter-spacing: 0;
        text-transform: none;
      }
      .live-only {
        visibility: hidden;
      }
      [data-cv-live] .live-only {
        visibility: visible;
      }
      /* STILL */
      /* a frame of the glide, for no webgl or ?still */
      .still {
        position: absolute;
        inset: 0;
        display: none;
        background: url("/stills/015-wide.webp") center 58% / cover no-repeat;
      }
      @media (max-aspect-ratio: 1/1) {
        .still {
          background-image: url("/stills/015-tall.webp");
        }
      }
      [data-cv-still] .still {
        display: block;
      }
      [data-cv-still] [data-cv-canvas] {
        display: none;
      }
      .cv-hud dd {
        font-variant-numeric: tabular-nums;
        min-width: 6ch;
      }
      @media (max-width: 640px) {
        .fig {
          display: none;
        }
        /* the sky is quiet up top; the readout sits under the title there */
        .cv-hud {
          gap: 8px;
        }
        .cv-hud dl {
          grid-auto-flow: column;
          grid-template-columns: none;
          gap: 0 14px;
        }
        .cv-hud dt {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .cv-hud dd {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-top mono">
      <a href="../">Codevember ’26</a>
      <span>Day 15 of 30</span>
      <nav data-cv-nav aria-label="Days"></nav>
    </header>

    <main data-cv>
      <div class="cv-figure">
        <canvas
          data-cv-canvas
          tabindex="0"
          aria-label="A flat poster of a desert horizon: pale sky, ochre ground, a red sun with cut stripes, a row of telegraph posts, a walker and an acacia. Just under the horizon, layers of hot air fold everything back, mirrored, squashed and stacked, shimmering. Move the pointer near the horizon, or use the left and right arrows, to heat the air there; scroll, swipe or press up and down to raise or lower your eyes."
        ></canvas>
        <div
          class="still"
          role="img"
          aria-label="A flat poster of a desert horizon with a red sun and telegraph posts, mirrored and stacked in a band of shimmering heat below the horizon"
        ></div>
      </div>

      <p class="fig mono">Fig. 15<br /><em>Inferior mirage</em></p>

      <section class="cv-title">
        <span class="mono">No. 15</span>
        <h1>Mirage<em>.</em></h1>
        <p>
          <em>The sky, bent back up off hot ground.</em> Hover the horizon to heat it, scroll to
          lower your eyes.
        </p>
      </section>

      <aside class="cv-hud mono live-only">
        <dl>
          <dt>Eye height</dt>
          <dd data-cv-eye>–</dd>
          <dt>Ground</dt>
          <dd data-cv-ground>–</dd>
          <dt>Mirage</dt>
          <dd data-cv-mirage>–</dd>
        </dl>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
