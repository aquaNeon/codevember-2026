<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirage · Codevember 015</title>
    <meta
      name="description"
      content="A desert road cut as a copperplate engraving, the heat bending its lines, and a pool of sky on it that you never reach. Codevember day 15."
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/stills/015-wide.webp"
      as="image"
      type="image/webp"
      media="(min-aspect-ratio: 4 / 5)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/stills/015-tall.webp"
      as="image"
      type="image/webp"
      media="(max-aspect-ratio: 4 / 5)"
      fetchpriority="high"
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f3ebd9" />
    <style>
      .cv-title.cv-title h1 {
        margin-bottom: 0.2em;
      }
      :root:root {
        --paper: #f3ebd9;
        --ink: #1e1914;
        --accent: #b8391a;
        --muted: #574d44;
        --rule: rgb(30 25 20 / 0.2);
        --bone: var(--paper);
      }
      .cv-top {
        background: var(--bone);
      }
      html body {
        background: var(--paper);
      }
      /* KNOCKOUT */
      .cv-top,
      .cv-title > :not(h1),
      .cv-hud,
      .fig {
        text-shadow:
          0 0 2px var(--paper),
          0 0 4px var(--paper),
          0 0 8px var(--paper),
          0 0 14px var(--paper);
      }
      .cv-figure canvas {
        position: relative;
        z-index: 1;
        touch-action: none;
        cursor: grab;
      }
      .cv-figure canvas:active {
        cursor: grabbing;
      }
      .cv-figure canvas:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: -8px;
      }
      .fig {
        padding: 4px 8px;
        margin: -4px -8px 0 0;
        background: var(--bone);
        position: fixed;
        top: 64px;
        right: var(--gutter);
        color: var(--muted);
        text-align: right;
      }
      .live-only {
        visibility: hidden;
      }
      [data-cv-live] .live-only {
        visibility: visible;
      }

      /* REVEAL */
      html body > main {
        animation: none;
      }
      .cv-hud,
      .fig {
        animation: cv-fade 0.6s cubic-bezier(0.2, 0.7, 0.1, 1) 1s backwards;
      }
      [data-cv-fonts] .cv-hud,
      [data-cv-fonts] .fig {
        animation-name: cv-fade-in;
        animation-delay: 0s;
      }

      /* STILL */
      .cv-figure canvas {
        opacity: 0;
        transition: opacity 0.8s cubic-bezier(0.2, 0.7, 0.1, 1);
      }
      [data-cv-live] .cv-figure canvas {
        opacity: 1;
      }
      [data-cv-still] .cv-figure canvas {
        display: none;
      }
      .still {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--paper);
      }
      .still img:not([data-cv-placed]) {
        visibility: hidden;
      }
      .still img {
        position: absolute;
        max-width: none;
        width: 275.5vh;
        height: 144.44vh;
        left: calc(53vw - 142.56vh);
        top: -22.22vh;
      }
      @media (max-aspect-ratio: 4 / 5) {
        .still img {
          width: 88.85vh;
          height: 137.9vh;
          left: calc(50vw - 44.43vh);
          top: -18.95vh;
        }
      }
      @media (max-width: 640px), (max-aspect-ratio: 1 / 1) {
        .fig {
          display: none;
        }
        .cv-hud.cv-hud,
        .cv-title.cv-title {
          bottom: auto;
          top: 64px;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-top mono">
      <a href="../">Codevember ’26</a>
      <span>Day 15 of 30</span>
      <nav data-cv-nav aria-label="Days"></nav>
    </header>

    <main data-cv>
      <div class="cv-figure">
        <canvas
          data-cv-canvas
          tabindex="0"
          aria-label="An engraving of a desert road running to the horizon under a vermilion sun, telegraph poles along it. The heat bends the engraved lines, and a pool of mirrored sky lies on the road ahead. Scroll, drag up or press the up arrow to drive toward it; it keeps its distance."
        ></canvas>
        <picture class="still" aria-hidden="true">
          <source media="(max-aspect-ratio: 4 / 5)" srcset="/stills/015-tall.webp" />
          <img src="/stills/015-wide.webp" alt="" fetchpriority="high" data-cv-plate />
        </picture>
        <noscript
          ><style>
            .still img {
              visibility: visible;
            }
          </style></noscript
        >
      </div>

      <p class="fig mono">Fig. 15<br />Inferior mirage, 46 °C</p>

      <section class="cv-title">
        <span class="mono">No. 15</span>
        <h1>Mirage<em>.</em></h1>
        <p><em>Water on the road, always just ahead.</em> Scroll or drag up to drive toward it.</p>
      </section>

      <aside class="cv-hud mono live-only">
        <dl>
          <dt>Driven</dt>
          <dd data-cv-driven>0 m</dd>
          <dt>Water</dt>
          <dd data-cv-ahead>62 m ahead</dd>
        </dl>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
