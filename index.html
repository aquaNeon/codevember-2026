<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codevember 2026</title>
    <meta
      name="description"
      content="Thirty small interactive sketches, one a day through November 2026."
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ebe5da" />
    <style>
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 96px var(--gutter) 64px;
      }
      .mast {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 24px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--ink);
      }
      .mast h1 {
        margin: 0;
        font: 400 clamp(64px, 13vw, 168px) / 0.84 var(--serif);
        letter-spacing: -0.035em;
      }
      .mast p {
        margin: 0;
        max-width: 22ch;
        font-size: 18px;
        text-align: right;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      /* TOP BAR */
      /* the list scrolls under it, so it carries the page background */
      .cv-top {
        background: radial-gradient(120% 90% at 50% 38%, var(--bone-hi), var(--bone) 70%) fixed;
      }

      /* ROWS */
      /* staggered by --cv-i */
      [data-cv-days] > li {
        animation: cv-rise 0.8s cubic-bezier(0.2, 0.7, 0.1, 1) calc(1.3s + var(--cv-i) * 30ms)
          backwards;
      }
      [data-cv-fonts] [data-cv-days] > li {
        animation-name: cv-rise-in;
        animation-delay: calc(0.3s + var(--cv-i) * 30ms);
      }
      @media (prefers-reduced-motion: reduce) {
        [data-cv-fonts] [data-cv-days] > li {
          animation-name: cv-fade-in;
        }
      }
      .row {
        --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
        position: relative;
        display: grid;
        grid-template-columns: 5ch 1fr auto;
        align-items: baseline;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid var(--rule);
        text-decoration: none;
      }
      .row strong {
        display: inline-flex;
        align-items: center;
        font: 400 clamp(28px, 4vw, 44px) / 1 var(--serif);
        letter-spacing: -0.02em;
      }
      .row .num,
      .row .tag {
        transition:
          color 0.4s var(--ease),
          transform 0.5s var(--ease);
      }
      .row .rule {
        width: 0;
        height: 1px;
        margin-right: 0;
        background: currentColor;
        transition:
          width 0.55s var(--ease),
          margin 0.55s var(--ease);
      }
      .row::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background: var(--ink);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.7s var(--ease);
      }
      a.row:hover::after,
      a.row:focus-visible::after {
        transform: scaleX(1);
      }
      a.row:hover .rule,
      a.row:focus-visible .rule {
        width: clamp(24px, 4vw, 48px);
        margin-right: 16px;
      }
      a.row:hover .num,
      a.row:focus-visible .num {
        color: var(--accent);
      }
      a.row:hover .tag,
      a.row:focus-visible .tag {
        transform: translateX(6px);
      }
      a.row:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: 6px;
      }
      .soon {
        color: var(--muted);
        opacity: 0.55;
      }

      /* PEEK */
      /* cursor-following thumb, fine pointer only */
      .peek {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 20;
        width: 280px;
        margin: 0;
        pointer-events: none;
        opacity: 0;
        transform: translate3d(var(--x, 0), var(--y, 0), 0) scale(0.96);
        translate: 0 14px;
        transition:
          opacity 0.25s ease,
          translate 0.45s cubic-bezier(0.2, 0.7, 0.1, 1),
          transform 0.35s cubic-bezier(0.2, 0.7, 0.1, 1);
        box-shadow: 0 18px 40px -18px rgb(40 28 16 / 0.35);
      }
      .peek[data-cv-on] {
        opacity: 1;
        transform: translate3d(var(--x, 0), var(--y, 0), 0) scale(1);
        translate: none;
      }
      .peek[data-cv-snap] {
        transition:
          opacity 0.25s ease,
          translate 0.45s cubic-bezier(0.2, 0.7, 0.1, 1);
      }
      .peek-frame {
        display: block;
        aspect-ratio: 280 / 187;
        overflow: hidden;
      }
      .peek-reel {
        display: block;
        transform: translate3d(0, calc(var(--i, 0) * -100% / var(--n, 1)), 0);
        transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.1, 1); /* change reel speed here */
      }
      .peek-reel[data-cv-snap] {
        transition: none;
      }
      .peek-reel img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 280 / 187;
      }
      @media (hover: none), (pointer: coarse) {
        .peek {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .row *,
        .row::after,
        .peek,
        .peek-reel {
          transition-duration: 0.01s !important;
        }
      }
      @media (max-width: 640px) {
        .mast {
          grid-template-columns: 1fr;
        }
        .mast p {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-top mono">
      <span>Codevember ’26</span>
      <span>Index</span>
      <span></span>
    </header>
    <main>
      <div class="mast">
        <h1>Codevember</h1>
        <p><em>Thirty small sketches,</em> one a day through November.</p>
      </div>
      <ol data-cv-days></ol>
      <figure class="peek" data-cv-peek aria-hidden="true">
        <span class="peek-frame"><span class="peek-reel" data-cv-reel></span></span>
      </figure>
    </main>
    <script type="module" src="./shared/gallery.ts"></script>
  </body>
</html>
